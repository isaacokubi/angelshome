services:
  - type: web
    name: angels-home-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGINS
        value: https://angelshome.vercel.app,http://localhost:5173,http://localhost:4173
      - key: SCHOOL_TIMEZONE
        value: Africa/Nairobi
      - key: JSON_BODY_LIMIT
        value: 1mb
